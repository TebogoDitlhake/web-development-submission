<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJI Osmo Pocket 3 | Custom Order Customiser</title>
    <!-- Bootstrap 5 CSS for Clean Card Layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Vue.js 2.x via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <!-- Main Vue Mount Element -->
                <div id="app" class="card shadow-sm p-4 border-0">
                    
                    <h2 class="fw-bold text-center mb-4">DJI Osmo Pocket 3 Customiser</h2>
                    
                    <!-- Form Input: Customer Engraving -->
                    <div class="mb-3">
                        <label for="engravingInput" class="form-label fw-bold">Personalised Handle Engraving:</label>
                        <input type="text" 
                               id="engravingInput" 
                               class="form-control" 
                               v-model="engravingText" 
                               placeholder="Type your name or handle (e.g. Sipho / Thabo Vlogs)">
                        <small class="text-muted">Type in the box above to see live updates below.</small>
                    </div>

                    <!-- Form Select: Package Choice -->
                    <div class="mb-4">
                        <label for="packageSelect" class="form-label fw-bold">Select Camera Package:</label>
                        <select id="packageSelect" class="form-select" v-model="selectedPackage">
                            <option value="Standard Package (R 11,499)">Standard Package - R 11,499.00</option>
                            <option value="Creator Combo (R 14,899)">Creator Combo - R 14,899.00</option>
                            <option value="Vlogger Bundle (R 16,999)">Vlogger Bundle - R 16,999.00</option>
                        </select>
                    </div>

                    <hr>

                    <!-- Real-Time Synchronised UI Display -->
                    <div class="p-3 bg-white rounded border">
                        <h4 class="fw-bold text-success mb-3">Live Order Preview:</h4>
                        
                        <p class="mb-2">
                            <strong>Chosen Package:</strong> 
                            <span>{{ selectedPackage }}</span>
                        </p>
                        
                        <p class="mb-2">
                            <strong>Handle Engraving Preview:</strong> 
                            <span class="badge bg-dark fs-6">{{ engravingText || 'No custom engraving added yet' }}</span>
                        </p>

                        <p class="mb-0 text-secondary">
                            Status: Real-time two-way synchronization active.
                        </p>
                    </div>

                </div><!-- End #app -->

            </div>
        </div>
    </div>

    <!-- Vue.js Application Logic -->
    <script>
        new Vue({
            el: '#app',
            data: {
                engravingText: '',
                selectedPackage: ''
            }
        });
    </script>

</body>
</html>
